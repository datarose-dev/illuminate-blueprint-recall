name: Test PHP Package

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event.label.name }}" = "needs-ci" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            pest: '^3.0'
            pest_plugin: '^3.0'

          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'
            pest: '^3.0'
            pest_plugin: '^3.0'

          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^4.0'
            pest_plugin: '^4.0'

          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
            pest_plugin: '^4.0'

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Check versions
        run: |
          php --version
          composer --version

      - name: Configure dependency matrix
        run: |
          composer require --no-update \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "orchestra/pest-plugin-testbench:${{ matrix.pest_plugin }}" \
            "pestphp/pest:${{ matrix.pest }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies

      - name: Show installed package versions
        run: |
          composer show laravel/framework || true
          composer show illuminate/contracts || true
          composer show orchestra/testbench || true
          composer show orchestra/pest-plugin-testbench || true
          composer show pestphp/pest || true
          composer show phpunit/phpunit || true

      - name: Run tests
        run: ./vendor/bin/pest --do-not-cache-result
