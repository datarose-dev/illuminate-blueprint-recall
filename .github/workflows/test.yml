name: Test PHP Package

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'phpunit.xml'
      - '.github/workflows/test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
            pest: '^3.0'
            pest_plugin: '^3.0'

          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'
            pest: '^3.0'
            pest_plugin: '^3.0'

          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            pest: '^4.0'
            pest_plugin: '^4.0'

          - php: '8.5'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
            pest_plugin: '^4.0'

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Check versions
        run: |
          php --version
          composer --version

      - name: Configure dependency matrix
        run: |
          composer require --no-update \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "orchestra/pest-plugin-testbench:${{ matrix.pest_plugin }}" \
            "pestphp/pest:${{ matrix.pest }}"

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies

      - name: Run tests
        run: composer test
